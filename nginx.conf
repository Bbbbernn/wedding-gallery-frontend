server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular usa il routing lato client: ogni percorso non trovato
    # (es. /galleria, /carica) deve ricadere su index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # env.js viene rigenerato a ogni avvio: non va mai messo in cache dal browser.
    location = /env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
    }

    # Il resto degli asset con hash nel nome puo' essere cachato a lungo.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
